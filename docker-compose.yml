# Usage:  cp .env.example .env   (edit the seed passwords if you like)   then   docker compose up --build
services:
  connect-four-api:
    build: .
    container_name: connect-four-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_STORAGE: /app/data/connect-four.sqlite
      JWT_KEYS_FILE: /app/data/jwt-keys.env
    volumes:
      # SQLite database and the auto-generated RS256 key pair survive restarts
      - sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  sqlite_data:
